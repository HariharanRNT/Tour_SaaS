<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"DEVELOPER15-29076-stderr-1780466485948.txt","computername":"DEVELOPER15","pid":29076,"type":"stderr","created":1780466485948},{"file":"DEVELOPER15-29076-stdout-1780466485948.txt","computername":"DEVELOPER15","pid":29076,"type":"stdout","created":1780466485948},{"file":"DEVELOPER15-31984-stderr-1780465958635.txt","computername":"DEVELOPER15","pid":31984,"type":"stderr","created":1780465958635},{"file":"DEVELOPER15-31984-stdout-1780465958635.txt","computername":"DEVELOPER15","pid":31984,"type":"stdout","created":1780465958635},{"file":"DEVELOPER15-32372-stderr-1780466158791.txt","computername":"DEVELOPER15","pid":32372,"type":"stderr","created":1780466158791},{"file":"DEVELOPER15-32372-stdout-1780466158790.txt","computername":"DEVELOPER15","pid":32372,"type":"stdout","created":1780466158790},{"file":"DEVELOPER15-6356-stderr-1780466578313.txt","computername":"DEVELOPER15","pid":6356,"type":"stderr","created":1780466578313},{"file":"DEVELOPER15-6356-stdout-1780466578313.txt","computername":"DEVELOPER15","pid":6356,"type":"stdout","created":1780466578313}];
        var lastUpdated = 1780466581150;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
